<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A resilient landing page with a live countdown and an accessible contact form.">
    <title>Resilient Landing Page</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <h1>Something Great Is Coming</h1>
        <p>We are preparing something special. Stay tuned.</p>
    </header>

    <main id="main-content">
        <section aria-labelledby="countdown-heading">
            <h2 id="countdown-heading">Launch Countdown</h2>
            <p>Time remaining until launch:</p>

            <div id="countdown" role="timer" aria-live="off">
                <p>Countdown will appear here.</p>
            </div>
        </section>

        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Get in Touch</h2>
            <p>Leave your details and we will get back to you.</p>

            <form id="contact-form">
                <div>
                    <label for="name">Full name</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        required
                        maxlength="100"
                    >
                </div>

                <div>
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        maxlength="254"
                    >
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                        maxlength="2000"
                    ></textarea>
                </div>

                <button id="submit-button" type="submit">
                    Send message
                </button>

                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Resilient Landing Page</p>
    </footer>
<script src="JS/countdown.js" defer></script>
</body>
</html>
